name: Windows HIP build

on:
  push:
    branches: [music-round/native-hip-current]
    paths: [buildhip.cmd, CMakeLists.txt, ggml, .github/workflows/hip-build.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openmp:
    uses: ./.github/workflows/hip-openmp.yml
  build:
    needs: openmp
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      ROCM_PATH: C:\rocm
      HIP_ARCHS: gfx1036,gfx1100
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ninja preflight
        shell: pwsh
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }

      - name: ROCm 10.1 gfx110X SDK
        shell: pwsh
        run: |
          $url = 'https://stable.repo.amd.com/rocm/core/tarball/therock-dist-windows-gfx110X-all-10.1.0.tar.gz'
          curl.exe -L --retry 3 -o D:\therock.tar.gz $url
          $hash = (Get-FileHash D:\therock.tar.gz -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '1313633026b05f8f6af2a6a16a2f323211dd81a904a808f0ee34d2bbfb8f8441') { throw "SDK tarball hash mismatch: $hash" }
          New-Item -ItemType Directory -Force -Path C:\rocm | Out-Null
          tar -xzf D:\therock.tar.gz -C C:\rocm
          Remove-Item D:\therock.tar.gz -Force

      - name: Build the engine (buildhip.cmd)
        shell: cmd
        run: |
          call buildhip.cmd

      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-llvm-openmp
          path: build-hip

      - name: Contract check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('yue-server.exe','ggml-hip.dll','ggml.dll','ggml-base.dll','ggml-cpu-x64.dll','ggml-cpu-haswell.dll','ggml-cpu-skylakex.dll','libomp140.x86_64.dll','LICENSE-LLVM-OpenMP.txt')) {
            if (-not (Test-Path (Join-Path build-hip $file))) { throw "Missing $file" }
          }
          $cache = Get-Content build-hip/CMakeCache.txt
          foreach ($setting in @('GGML_CPU_ALL_VARIANTS:BOOL=ON','GGML_OPENMP:BOOL=ON','GGML_NATIVE:BOOL=OFF')) {
            if ($setting -notin $cache) { throw "Unexpected CMake setting: $setting" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: yue2-hip-engine-gfx1036-gfx1100
          path: |
            build-hip/yue-server.exe
            build-hip/*.dll
            build-hip/LICENSE-LLVM-OpenMP.txt
          retention-days: 7
