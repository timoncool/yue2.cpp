name: Build & Release Binaries
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Full version tag. Leave empty for artifact-only validation.
        type: string

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -n "$TAG" && ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]]; then
            echo 'Full distributions require a vMAJOR.MINOR.PATCH tag.' >&2
            exit 1
          fi
          printf 'tag=%s\nref=%s\n' "$TAG" "${TAG:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, package: linux-x64}
          - {os: macos-15, package: macos-arm64-metal}
          - {os: windows-2022, package: windows-x64}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.ref }}
          submodules: recursive
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build pkg-config libopenblas-dev
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - if: runner.os != 'macOS'
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: '13.1.0'
          method: network
      - if: runner.os != 'macOS'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: 09913f088a1197aba4aefd300a876b2ebbaa3391 # vulkan-sdk-1.4.309.0
          path: spirv-headers
      - name: Configure, build, and stage
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          flags=(-G Ninja -DCMAKE_BUILD_TYPE=Release)
          if [[ "$RUNNER_OS" == macOS ]]; then
            flags+=(-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON
                    -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON -DCMAKE_INSTALL_RPATH=@loader_path)
          else
            nvcc --version
            flags+=(-DGGML_NATIVE=OFF -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON
                    -DGGML_CUDA=ON -DGGML_CUDA_NCCL=OFF -DGGML_CUDA_FA_QUANTS=all -DGGML_VULKAN=ON)
            if [[ "$RUNNER_OS" == Linux ]]; then
              flags+=(-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON '-DCMAKE_INSTALL_RPATH=$ORIGIN')
            else
              spirv_prefix="$(pwd -W)/spirv-headers-install"
              cmake -S spirv-headers -B spirv-headers-build -G Ninja
              cmake --install spirv-headers-build --prefix "$spirv_prefix"
              flags+=("-DCMAKE_PREFIX_PATH=$spirv_prefix")
            fi
          fi
          cmake -S . -B build "${flags[@]}"
          cmake --build build --parallel 4
          mkdir dist
          ext=
          if [[ "$RUNNER_OS" == Windows ]]; then ext=.exe; fi
          for tool in yue-server yue-synth yue-plan yue-tokenize yue-transcribe neural-codec mp3-codec quantize; do
            cp "build/$tool$ext" dist/
          done
          case "$RUNNER_OS" in
            Windows)
              cp build/*.dll dist/
              test -f dist/ggml-cuda.dll
              test -f dist/ggml-vulkan.dll
              ;;
            Linux)
              cp -P build/libggml*.so* dist/
              test -f dist/libggml-cuda.so
              test -f dist/libggml-vulkan.so
              readelf -d dist/yue-server | grep -F '$ORIGIN'
              ;;
            macOS)
              cp -P build/libggml*.dylib dist/
              for binary in dist/*; do
                [[ -L "$binary" ]] && continue
                test "$(lipo -archs "$binary")" = arm64
                minos=$(xcrun vtool -show-build "$binary" | awk '$1 == "minos" {print $2}')
                test "$minos" = 13.0
              done
              ;;
          esac
          "dist/yue-server$ext" --help > usage.txt 2>&1 || test "$?" -eq 1
          grep -F 'Usage' usage.txt
          if [[ "$RUNNER_OS" != Windows ]]; then tar -C dist -czf "yue2-$PACKAGE.tar.gz" .; fi
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'dist/*' -DestinationPath 'yue2-windows-x64.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: yue2-${{ matrix.package }}
          path: |
            yue2-*.tar.gz
            yue2-*.zip
          if-no-files-found: error

  publish:
    needs: [select, build]
    if: needs.select.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: yue2-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.select.outputs.tag }}
        run: gh release upload "$TAG" yue2-*.tar.gz yue2-*.zip
