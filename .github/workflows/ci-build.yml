# Validate that the project builds on Ubuntu and macOS (no model download).
name: CI Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential pkg-config libopenblas-dev
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DGGML_BLAS=ON
          cmake --build . --config Release -j$(nproc)

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir build && cd build
          cmake ..
          cmake --build . --config Release -j$(sysctl -n hw.ncpu)

      - name: Smoke test
        run: |
          ./build/yue-server --help > server-help.txt 2>&1 || test "$?" -eq 1
          grep -F "Usage" server-help.txt

  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format cppcheck

      - name: Run clang-format (check mode)
        run: |
          find . \
          \( -path './.git' -o -path './ggml' -o -path './build' -o -path './vendor' -o -path './mp3' \) -prune -o \
          -type f \( -name '*.c' -o -name '*.h' -o -name '*.cc' -o -name '*.cpp' -o -name '*.hpp' \) \
          -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Run cppcheck on first-party code
        run: |
          set -euo pipefail
          cppcheck --enable=all --inline-suppr \
            --template='{file}:{line}:{column}: {severity}: {message} [{id}]' \
            -I . -I src -I ggml/include -I vendor/yyjson src tools tests 2>&1 | tee cppcheck-first-party.log
          # Included third-party headers can emit findings even when checking a first-party unit.
          if grep -E '^[^:]+:[0-9]+:[0-9]+: (error|warning):' cppcheck-first-party.log |
              grep -Ev '^(vendor|mp3|ggml)/'; then
            echo 'First-party cppcheck errors or warnings must be resolved.' >&2
            exit 1
          fi

      - name: Record cppcheck findings in vendored dependencies
        if: always()
        run: |
          set -euo pipefail
          cppcheck --enable=all --template='{file}:{line}:{column}: {severity}: {message} [{id}]' \
            vendor mp3 2>&1 | tee cppcheck-vendor.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cppcheck-reports
          path: cppcheck-*.log
